on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    name: OTP 28 / Elixir 1.19
    steps:
      - name: Checkout ${{github.repository}}
        uses: actions/checkout@v7
      - name: Checkout sqltest
        uses: actions/checkout@v7
        with:
            path: sqltest
            repository: elliotchance/sqltest
      - name: Install PostgreSQL Binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl stop postgresql
          sudo chown -R $USER:$USER /var/run/postgresql
          PG_BINDIR=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          echo "$PG_BINDIR" >> $GITHUB_PATH
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 28
          elixir-version: 1.19
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - run: mix deps.get && mix sql.gen.test sqltest/standards/2016 && mix test
